name: Release

# HACS treats every GitHub release as an integration update. Changing the
# manifest version on main is therefore the complete release process.
on:
  push:
    branches: [main]
    paths: ['custom_components/yarukoto/manifest.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - id: version
        run: echo "value=$(jq -r .version custom_components/yarukoto/manifest.json)" >> "$GITHUB_OUTPUT"

      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.value }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG is already released"
            exit 0
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes

